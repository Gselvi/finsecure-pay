# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
# Create the SMTP secret first (never commit it):
#   kubectl -n monitoring create secret generic alertmanager-smtp --from-literal=password='<SMTP app password>'
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# EKS does not expose these control-plane components, so their default alerts would fire permanently
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp      # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: YOUR_SENDER@gmail.com
      smtp_auth_username: YOUR_SENDER@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: "null"          # everything else is dropped; only the app's own alerts are emailed
      group_by: [alertname]
      routes:
        - receiver: email
          matchers:
            - alertname =~ "FinSecurePay.*"
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: YOUR_RECIPIENT@example.com
            send_resolved: true
