# Create: eksctl create cluster -f eks/cluster.yaml
# Delete: kubectl -n finsecure delete svc finsecure-pay; eksctl delete cluster -f eks/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: finsecure-eks
  region: us-east-1   # matches the console region; change if you use another
  tags:
    project: finsecure-capstone

addons:   # install vpc-cni and kube-proxy before the node group, coredns after it
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns

managedNodeGroups:
  - name: ng-flex
    instanceType: c7i-flex.large   # 4 GiB; free-plan eligible (t3.medium is not)
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
