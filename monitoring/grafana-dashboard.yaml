apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  finsecure-pay.json: |
    {
      "title": "FinSecure Pay",
      "uid": "finsecure-pay",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by status (/validate)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"finsecure\", uri=\"/validate\"}[1m]))", "legendFormat": "{{status}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "p95 latency (/validate)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"finsecure\", uri=\"/validate\"}[5m])))", "legendFormat": "p95" } ]
        },
        {
          "id": 3, "type": "stat", "title": "Healthy pods",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 6 },
          "targets": [ { "expr": "sum(up{namespace=\"finsecure\", service=\"finsecure-pay\"})" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "JVM heap used per pod",
          "gridPos": { "x": 6, "y": 8, "w": 9, "h": 6 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [ { "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"finsecure\", area=\"heap\"})", "legendFormat": "{{pod}}" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Pod CPU usage (infrastructure)",
          "gridPos": { "x": 15, "y": 8, "w": 9, "h": 6 },
          "targets": [ { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"finsecure\", container=\"finsecure-pay\"}[1m]))", "legendFormat": "{{pod}}" } ]
        }
      ]
    }
