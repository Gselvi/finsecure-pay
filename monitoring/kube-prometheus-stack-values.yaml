# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
# Create the SMTP secret first (never commit it):
#   kubectl -n monitoring create secret generic alertmanager-smtp --from-literal=password='<SMTP app password>'
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp      # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: YOUR_SENDER@gmail.com
      smtp_auth_username: YOUR_SENDER@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: YOUR_RECIPIENT@example.com
            send_resolved: true
