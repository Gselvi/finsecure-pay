apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: finsecure-pay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finsecure-pay
          # Jenkins replaces the tag with `kubectl set image`
          image: DOCKERHUB_USER/finsecure-pay:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app: finsecure-pay
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: http
